# app store peer: keeps app packages whose publisher signature checks and serves them by app id
# Runs on its own, wherever this peer lives. From this directory:
#   cp .env.example .env     (then set the broker and the addresses; keys and secrets stay in .env)
#   docker compose up -d
# The image comes from deploy/build.sh (no build here). Network: host, so this peer is reached at ARENA_PUBLIC_HOST
# (default: ARENA_HOST, 127.0.0.1). To serve others: ARENA_HOST=0.0.0.0 and ARENA_PUBLIC_HOST=<this server's address>.
# The peer keeps connecting to its broker until it answers. Guide: dev/docker.md
services:
  app-store-peer:
    image: ${ARENA_IMAGE:-agent-arena:latest}
    command: ["arena.peers.app_store"]
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ARENA_HOST: ${ARENA_HOST:-127.0.0.1}
      ARENA_PUBLIC_HOST: ${ARENA_PUBLIC_HOST:-}
      ARENA_KEY_STORE: file
      ARENA_APP_STORE_PEER_BROKERS: ${ARENA_APP_STORE_PEER_BROKERS:-public=http://127.0.0.1:9100}
      ARENA_APP_STORE_PEER_PORT: ${ARENA_APP_STORE_PEER_PORT:-9150}
      ARENA_APP_STORE_PEER_KEY_FILE: ${ARENA_APP_STORE_PEER_KEY_FILE:-/app/data/app-store-peer.key}
      ARENA_APP_STORE_PEER_AREA: ${ARENA_APP_STORE_PEER_AREA:-/app/data/area}
      ARENA_APP_STORE_DIR: ${ARENA_APP_STORE_DIR:-/app/data/packages}
    volumes:
      - data:/app/data

volumes:
  data:
